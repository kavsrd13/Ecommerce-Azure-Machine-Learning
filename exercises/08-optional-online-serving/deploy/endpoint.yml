# =====================================================================================
#  MANAGED ONLINE ENDPOINT - the stable HTTPS address clients call
# -------------------------------------------------------------------------------------
#  An endpoint is just the URL + authentication. The model runs in one or more
#  DEPLOYMENTS behind it (see deployment.yml); traffic can be split between deployments
#  for blue/green releases without changing the URL clients use.
#  The name must be unique within the Azure region.
#  Schema: https://learn.microsoft.com/azure/machine-learning/reference-yaml-endpoint-online
# =====================================================================================
$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineEndpoint.schema.json
name: freight-olist   # placeholder - scripts/deploy-endpoint.ps1 replaces it with -EndpointName
description: Predicts the shipping cost (BRL) of an Olist order item.
auth_mode: key   # clients send "Authorization: Bearer <key>"
tags:
  model: olist-freight-cost
